<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rupture Cheats</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f0ff;
            color: #4c2a8c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        .title {
            font-size: 3rem;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        .info-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #4c2a8c;
        }

        .form {
            margin-top: 20px;
        }

        .form input {
            margin: 10px;
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #4c2a8c;
            border-radius: 5px;
            width: 250px;
        }

        .form button {
            background-color: #4c2a8c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        .form button:hover {
            background-color: #362163;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }

        .modal-content button {
            margin-top: 10px;
            background-color: #4c2a8c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">

        <button class="info-button" onclick="toggleModal()">?</button>

            <input type="email" placeholder="Введите вашу почту" required>
            <input type="password" placeholder="Введите пароль" required>
            <button onclick="redirectToMaintenance()">Зарегистрироваться</button>
        </div>
    </div>

    <div id="modal" class="modal">

            <p><strong>Кто мы?</strong><br>Мы сервис Rupture Cheats, который занимается созданием читов, и их бесплатную публикацию! Больше 2000 клиентов, 9 месяцев работы, и десятки лучших читов на любые игры!</p>
            <button onclick="toggleModal()">Закрыть</button>
        </div>
    </div>

    <script>
        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function redirectToMaintenance() {
            document.body.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; background-color: #e5dff8;">
                    <h1 style="color: #4c2a8c;">Сайт находится на техническом обслуживании, зайдите позже</h1>
                    <p style="color: #4c2a8c;">А если сайт до сих пор не работает, напишите в поддержку в Telegram: <a href="https://t.me/saveworldffr" style="color: #4c2a8c;">@saveworldffr</a></p>
                </div>
            `;
        }
    </script>
</body>
</html>
